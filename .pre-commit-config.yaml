repos:
- repo: https://github.com/pycqa/isort
  rev: 10.0.0b2
  hooks:
  - id: isort
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    args:
    - --write-changes
    additional_dependencies:
    - tomli
    exclude: dashboards/vendor/*
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/yuvipanda/ruamelfmt
  rev: v1.0.0
  hooks:
  - id: ruamelfmt
    exclude: helm/.*|config/clusters/templates/.*
  exclude: dashboards/vendor/*

ci:
  autoupdate_schedule: monthly
