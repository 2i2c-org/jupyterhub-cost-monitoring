apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jupyterhub-cost-monitoring.webserver.fullname" . }}-deployment
  labels:
    {{- include "jupyterhub-cost-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jupyterhub-cost-monitoring.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/service-account: {{ include (print .Template.BasePath "/serviceaccount.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
      labels:
        {{- include "jupyterhub-cost-monitoring.labels" . | nindent 8 }}
    spec:
      volumes:
      - name: config
        secret:
          secretName: {{ include "jupyterhub-cost-monitoring.resourceName" . }}
      containers:
        - name: webserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: JUPYTERHUBCOSTMONITORING__JupyterHubCostMonitoring__config_file
              value: "/usr/local/etc/jupyterhub_cost_monitoring/jupyterhub_cost_monitoring_config.py"
            {{- with .Values.extraEnv }}
            {{- tpl (. | toYaml) $ | nindent 12 }}
            {{- end }}
            {{- if .Values.prometheusAuth.enabled }}
            - name: PROMETHEUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheusAuth.envFromSecret }}
                  key: username
            - name: PROMETHEUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.prometheusAuth.envFromSecret }}
                  key: password
            {{- end }}
          resources:
            {{- .Values.resources | toYaml | nindent 12 }}
          securityContext:
            {{- .Values.securityContext | toYaml | nindent 12 }}
          volumeMounts:
          - name: config
            mountPath: /usr/local/etc/jupyterhub_cost_monitoring/
          startupProbe:
            periodSeconds: 1
            failureThreshold: 60
            httpGet:
              path: /health/ready
              port: http
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with include "jupyterhub-cost-monitoring.webserver.serviceaccount.fullname" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
